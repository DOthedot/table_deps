name: CI

# Mirrors local guardrails exactly: CI runs the same `make verify` your hooks run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node (JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify (fmt-check + lint + typecheck + js + public drift + tests)
        run: make verify
