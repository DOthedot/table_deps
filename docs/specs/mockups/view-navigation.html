<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>View Navigation Mockup</title>
<style>
/* Theme tokens copied from table_deps/frontend_service/static/css/shared.css */
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#21262d; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950;
  --orange:#d29922; --red:#f85149; --purple:#bc8cff;
  --pin:#ffea7f; --doc-bg:#05080c;
  --mono:'SF Mono','Fira Code',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--doc-bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:11px var(--mono);background:var(--surface2);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* ── Document chrome (outside the mock app) ── */
.doc-head{max-width:1500px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.doc-head h1{font-size:20px;font-weight:650}
.doc-head p{color:var(--muted);font-size:13px;max-width:640px}
.scen{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-left:auto}
.scen button{background:none;border:0;border-radius:7px;padding:7px 14px;font-size:13px;color:var(--muted)}
.scen button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.scen .rec{font-size:10px;color:var(--green);margin-left:6px}
.layout{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}
@media (max-width:1100px){.layout{grid-template-columns:1fr}}

/* ── Fake browser ── */
.browser{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg);min-width:0}
.tabs{display:flex;gap:2px;background:#010409;padding:8px 10px 0}
.tab{display:flex;align-items:center;gap:8px;background:transparent;border:0;border-radius:8px 8px 0 0;padding:6px 14px;font-size:12px;color:var(--muted);max-width:220px}
.tab.on{background:var(--surface);color:var(--text)}
.tab .x{opacity:.5;font-size:11px}
.chrome{display:flex;align-items:center;gap:6px;background:var(--surface);padding:7px 10px;border-bottom:1px solid var(--border)}
.chrome .nav{background:none;border:0;width:26px;height:26px;border-radius:6px;color:var(--muted);font-size:15px}
.chrome .nav:not(:disabled):hover{background:var(--surface2);color:var(--text)}
.chrome .nav:disabled{opacity:.3;cursor:default}
.addr{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:4px 14px;font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr b{color:var(--text);font-weight:500}

/* ── Mock app ── */
.app{height:660px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.app header{display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;min-height:46px}
.logo{font:700 15px var(--mono);color:var(--accent);white-space:nowrap}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.tip{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:3px 8px;white-space:nowrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:6px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.seg kbd{font-size:10px;padding:0 4px}
.crumb{display:flex;align-items:center;gap:6px;font:12.5px var(--mono);color:var(--muted);min-width:0;white-space:nowrap}
.crumb a{color:var(--muted);text-decoration:none;cursor:pointer;border-radius:4px;padding:1px 4px}
.crumb a:hover{color:var(--text);background:var(--surface2)}
.crumb .cur{color:var(--text)}
.crumb .sep{opacity:.5}
.jump{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);min-width:200px}
.jump:hover{border-color:var(--accent)}

.ctx{display:flex;align-items:center;gap:10px;padding:7px 16px;background:color-mix(in srgb,var(--accent) 6%,var(--surface));border-bottom:1px solid var(--border);font-size:12px;flex-shrink:0;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px}
.back:hover{border-color:var(--accent)}
.ctx .lbl{color:var(--muted)}
.ctx .divider{width:1px;height:16px;background:var(--border)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:1px 9px;font:11.5px var(--mono);color:var(--text)}
button.chip:hover{border-color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.sib{display:flex;gap:4px;margin-left:auto}
.sib button{background:var(--surface2);border:1px solid var(--border);border-radius:6px;width:26px;height:24px;font-size:12px}
.sib button:hover{border-color:var(--accent)}

.main{flex:1;display:flex;min-height:0}
aside.sb{width:250px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto}
.section{padding:14px 14px;border-bottom:1px solid var(--border)}
.slabel{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.navbtn{display:flex;align-items:center;gap:8px;margin:12px 14px 0;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);font-size:13px;color:var(--text);text-decoration:none;cursor:pointer}
.navbtn .arr{margin-left:auto;color:var(--muted)}
.proj-card{border:1px solid var(--accent);border-radius:8px;padding:12px;text-align:center;background:var(--bg)}
.proj-card b{display:block;font-size:13px}
.proj-card small{color:var(--muted);font-size:11px}
.btnrow{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:12px}
.btn.pri{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--bg);border:1px solid var(--border);border-radius:6px;text-align:center;padding:6px 0}
.stat .n{font-size:17px;font-weight:700;color:var(--accent)}
.stat .l{font-size:10px;color:var(--muted)}
.tlist{list-style:none;display:flex;flex-direction:column;gap:3px}
.tlist li{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:5px;background:var(--bg);border-left:3px solid var(--c);font:11.5px var(--mono);cursor:pointer}
.tlist li:hover,.tlist li.sel{background:var(--surface2)}
.tlist li.sel{outline:1px solid var(--accent)}
.tlist .lv{margin-left:auto;color:var(--muted);font-size:10px}
.tlist .open{display:none;color:var(--accent);font-size:12px}
.tlist li:hover .open{display:inline}
.tlist li:hover .lv{display:none}
textarea.sql{width:100%;height:190px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font:11px/1.5 var(--mono);padding:8px;resize:none}
textarea.sql[readonly]{color:#c9d1d9;border-style:dashed}
.src-note{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:6px}
.src-note button{margin-left:auto;white-space:nowrap;background:none;border:1px solid var(--border);border-radius:5px;font-size:11px;padding:1px 7px;color:var(--accent)}

.canvas{flex:1;position:relative;min-width:0;background-color:var(--bg);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:22px 22px}
.canvas svg{width:100%;height:100%;display:block}
.frozen{position:absolute;left:12px;bottom:10px;font-size:10.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 8px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:20px}
.empty .ic{font-size:34px;opacity:.6}
.empty p{color:var(--text)}
.gnode{cursor:pointer}
.gnode text{font-family:var(--mono);pointer-events:none}
.edge{fill:none;stroke:#94a3b8;stroke-width:1.2;opacity:.45}
.edge.hi{stroke:var(--accent);opacity:1;stroke-width:1.8}
.faded{opacity:.18}

.tooltip{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;width:220px;pointer-events:none;box-shadow:0 8px 24px #0008}
.tooltip .tn{font:600 13px var(--mono);margin-bottom:6px}
.tooltip .r{display:flex;justify-content:space-between;color:var(--muted)}
.tooltip .h{margin-top:8px;padding-top:6px;border-top:1px solid var(--border);font-size:10.5px;color:var(--muted)}

.inspector{position:absolute;top:12px;right:12px;bottom:12px;width:280px;background:var(--surface);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;box-shadow:0 12px 32px #000a;overflow:hidden}
.ins-head{padding:12px 14px;border-bottom:1px solid var(--border);border-top:3px solid var(--c)}
.ins-head .nm{font:600 14px var(--mono)}
.ins-head .fl{font:11px var(--mono);color:var(--muted);margin-top:2px}
.ins-head .close{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--muted)}
.ins-body{padding:12px 14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.ins-body .slabel{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12px;color:var(--muted)}
.kv b{color:var(--text);font-weight:600;text-align:right}
.ins-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.ins-foot .btn{padding:8px}
.ins-foot .hint{font-size:10.5px;color:var(--muted);text-align:center}

.split{width:44%;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
.split-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface);font:12px var(--mono)}
.split-head .x{margin-left:auto;background:none;border:0;color:var(--muted)}
.split .canvas{flex:1}

.palette-bg{position:absolute;inset:0;background:#0009;display:flex;justify-content:center;padding-top:70px;z-index:20}
.palette{width:460px;max-height:420px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px #000c;display:flex;flex-direction:column;overflow:hidden}
.palette input{background:none;border:0;border-bottom:1px solid var(--border);padding:13px 16px;color:var(--text);font:14px var(--mono);outline:none}
.palette ul{list-style:none;overflow-y:auto;padding:6px}
.palette li{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;font:12.5px var(--mono);cursor:pointer}
.palette li.on{background:var(--surface2)}
.palette li .lv{margin-left:auto;color:var(--muted);font-size:10.5px}
.palette .foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

/* ── Callout pins + notes ── */
.pin{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--pin);color:#1b1500;font:700 10px/1 -apple-system,sans-serif;flex-shrink:0;box-shadow:0 0 0 3px #ffea7f33}
.pin.abs{position:absolute;z-index:5}
.notes{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;align-self:start;position:sticky;top:16px}
.notes h2{font-size:15px;margin-bottom:4px}
.notes .verdict{font-size:12px;color:var(--muted);margin-bottom:14px}
.notes ol{list-style:none;display:flex;flex-direction:column;gap:11px}
.notes li{display:flex;gap:10px;font-size:13px}
.notes li .pin{margin-top:1px}
.notes .bad{color:#ffa198}
.notes h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.notes .try{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.notes .try b{color:var(--text);font-weight:500}
.notes .proscons{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}
.notes .proscons div{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.notes .proscons b{display:block;font-size:11px;margin-bottom:4px}
</style>
</head>
<body>

<div class="doc-head">
  <div>
    <h1>table-deps · View navigation mockup</h1>
    <p>How you move between the <b>Project view</b> (DAG) and the <b>Query view</b> (single SQL).
       Only the chrome changes. The DAG and table graphs are drawn as simplified stand-ins and stay
       exactly as they are today. Data is the real <code>kimball_retail</code> project.</p>
  </div>
  <div class="scen" id="scen">
    <button data-s="before">Today</button>
    <button data-s="A">A · Unified shell<span class="rec">recommended</span></button>
    <button data-s="B">B · Split view</button>
  </div>
</div>

<div class="layout">
  <div class="browser">
    <div class="tabs" id="tabs"></div>
    <div class="chrome">
      <button class="nav" id="nav-back" title="Back">&#8592;</button>
      <button class="nav" id="nav-fwd" title="Forward">&#8594;</button>
      <div class="addr" id="addr"></div>
    </div>
    <div class="app" id="app"></div>
  </div>
  <aside class="notes" id="notes"></aside>
</div>

<script>
// ── Real data: test_projects/kimball_retail via project_scanner ──────────────
const PROJECT = 'kimball_retail';
const RAW = {
  'dim.customer':['src.raw_customers'], 'dim.date':[], 'dim.product':['src.raw_products'],
  'dim.promotion':['src.raw_promotions'], 'dim.store':['src.raw_stores'],
  'fact.returns':['dim.customer','dim.date','dim.product','dim.store','src.raw_transactions'],
  'fact.sales':['dim.customer','dim.date','dim.product','dim.promotion','dim.store','src.raw_transactions'],
  'rpt.customer_360':['dim.customer','dim.date','fact.returns','fact.sales'],
  'rpt.product_performance':['dim.date','dim.product','dim.store','fact.returns','fact.sales'],
  'rpt.sales_by_channel':['dim.customer','dim.date','dim.promotion','fact.sales'],
  'src.raw_customers':[], 'src.raw_products':[], 'src.raw_promotions':[], 'src.raw_stores':[], 'src.raw_transactions':[],
};
const EXT = {
  'dim.date':['external.util_db.dim_date'], 'src.raw_customers':['external.crm_db.customers'],
  'src.raw_products':['external.erp_db.product_catalog'], 'src.raw_promotions':['external.marketing_db.promotions'],
  'src.raw_stores':['external.ops_db.stores'], 'src.raw_transactions':['external.pos_db.transactions'],
};
const COLORS = { dim:'#58a6ff', fact:'#3fb950', rpt:'#d29922', src:'#f85149', external:'#6b7280' };
const color = id => COLORS[id.split('.')[0]] || '#6b7280';
const IDS = Object.keys(RAW);
const LEVEL = {};
const lvl = id => LEVEL[id] ??= RAW[id].length ? 1 + Math.max(...RAW[id].map(lvl)) : 0;
IDS.forEach(lvl);
const ORDERED = [...IDS].sort((a,b) => LEVEL[a]-LEVEL[b] || a.localeCompare(b));
const usedBy = id => IDS.filter(o => RAW[o].includes(id));
const EDGES = IDS.flatMap(t => RAW[t].map(s => [s,t]));

// ── State + fake browser history ─────────────────────────────────────────────
let scenario = 'A';
let tabs, active;              // tabs: [{title, hist:[state], i}]
let hover = null, palette = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function reset() {
  const s0 = { view:'project', loaded:true, sel:null, file:null };
  tabs = [{ hist:[s0], i:0 }]; active = 0; hover = null; palette = null;
  render();
}
const cur = () => tabs[active].hist[tabs[active].i];
function go(patch, { replace=false } = {}) {
  const t = tabs[active];
  const next = { ...cur(), ...patch };
  if (replace) t.hist[t.i] = next;
  else { t.hist = t.hist.slice(0, t.i+1); t.hist.push(next); t.i++; }
  render();
}
function openNewTab(state) { tabs.push({ hist:[state], i:0 }); active = tabs.length-1; render(); }

function url(s) {
  const host = '<span>127.0.0.1:8765</span>';
  if (scenario === 'before') return host + `<b>${s.view === 'project' ? '/project' : '/'}</b>`;
  if (scenario === 'B') return host + `<b>/project</b>?p=${PROJECT}${s.sel ? '&amp;open=' + s.sel : ''}`;
  if (s.view === 'project') return host + `<b>/project</b>?p=${PROJECT}${s.sel ? '&amp;sel=' + s.sel : ''}`;
  return host + `<b>/query</b>${s.file ? `?p=${PROJECT}&amp;t=${s.file}` : ''}`;
}
const title = s => s.view === 'project'
  ? (scenario === 'before' ? 'Project DAG' : `${PROJECT} · table-deps`)
  : (scenario === 'before' ? 'SQL Visualizer' : `${s.file || 'Scratch query'} · table-deps`);

// ── Graph stand-ins (the real renderers are untouched) ───────────────────────
const BW = 150, BH = 62;
function dagPos() {
  const pos = {}, byLv = {};
  ORDERED.forEach(id => (byLv[LEVEL[id]] ??= []).push(id));
  Object.entries(byLv).forEach(([lv, ids]) => {
    const gap = 18, total = ids.length*BH + (ids.length-1)*gap, y0 = (560-total)/2;
    ids.forEach((id, k) => pos[id] = { x: 40 + lv*235, y: y0 + k*(BH+gap) });
  });
  return pos;
}
function box(id, x, y, { badge=false, faded=false, sel=false, ext=false } = {}) {
  const c = ext ? COLORS.external : color(id), [sch, ...rest] = id.split('.');
  const bars = [0,1,2].map(k => `<rect x="${x+12}" y="${y+26+k*11}" width="${[90,70,104][k]}" height="4" rx="2" fill="${c}" opacity=".35"/>`).join('');
  return `<g class="gnode ${faded?'faded':''}" data-id="${id}">
    <rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="5" fill="color-mix(in srgb, ${c} 12%, #0d1117)" stroke="${c}" stroke-width="${sel?2.4:1}"/>
    <rect x="${x}" y="${y}" width="${BW}" height="17" rx="5" fill="${c}" opacity=".28"/>
    <text x="${x+8}" y="${y+12.5}" font-size="10" fill="${c}"><tspan opacity=".7">${sch}.</tspan><tspan font-weight="700">${rest.join('.')}</tspan></text>
    ${bars}
    ${badge ? `<g><rect x="${x+BW-26}" y="${y+BH-20}" width="20" height="15" rx="4" fill="#21262d" stroke="${c}"/><text x="${x+BW-16}" y="${y+BH-9}" font-size="10" text-anchor="middle" fill="${c}">↗</text></g>` : ''}
  </g>`;
}
function curve(a, b, cls='') {
  const x1=a.x+BW, y1=a.y+BH/2, x2=b.x, y2=b.y+BH/2, mx=(x1+x2)/2;
  return `<path class="edge ${cls}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2-4},${y2}" marker-end="url(#arr)"/>`;
}
const DEFS = `<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#94a3b8"/></marker></defs>`;

function dagSvg(sel) {
  const pos = dagPos(), focus = sel || hover;
  const near = focus ? new Set([focus, ...RAW[focus], ...usedBy(focus)]) : null;
  const edges = EDGES.map(([s,t]) => curve(pos[s], pos[t], focus && (s===focus||t===focus) ? 'hi' : (focus ? 'faded' : ''))).join('');
  const nodes = ORDERED.map(id => box(id, pos[id].x, pos[id].y, { faded: near && !near.has(id), sel: id === sel })).join('');
  return `<svg viewBox="0 0 960 560" preserveAspectRatio="xMidYMid meet">${DEFS}${edges}${nodes}</svg>`;
}
function querySvg(file, { badges=false } = {}) {
  const refs = [...RAW[file], ...(EXT[file] || [])];
  const cx = 420, cy = 250, pos = {};
  pos[refs[0]] = { x: cx - BW/2, y: cy - BH/2 };
  refs.slice(1).forEach((r, k, a) => {
    const ang = -Math.PI/2 + (k + .5) * (2*Math.PI / Math.max(a.length, 1));
    pos[r] = { x: cx + Math.cos(ang)*270 - BW/2, y: cy + Math.sin(ang)*190 - BH/2 };
  });
  const joins = ['LEFT','INNER','LEFT','INNER','LEFT'];
  const edges = refs.slice(1).map((r, k) => {
    const a = pos[refs[0]], b = pos[r], x1=a.x+BW/2, y1=a.y+BH/2, x2=b.x+BW/2, y2=b.y+BH/2;
    return `<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="opacity:.6"/>
      <text x="${(x1+x2)/2}" y="${(y1+y2)/2-4}" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="monospace">${joins[k]}</text>`;
  }).join('');
  const nodes = refs.map(r => box(r, pos[r].x, pos[r].y, { badge: badges && r in RAW, ext: !(r in RAW) })).join('');
  return `<svg viewBox="0 0 840 500" preserveAspectRatio="xMidYMid meet">${edges}${nodes}</svg>`;
}
function fakeSql(file) {
  const refs = [...RAW[file], ...(EXT[file] || [])];
  if (!refs.length) return `-- ${file}.sql\nSELECT ...`;
  const [from, ...joins] = refs;
  return `-- ${file}.sql\nSELECT\n  ...\nFROM ${from} t\n` +
    joins.map((r,k) => `${['LEFT','INNER'][k%2]} JOIN ${r} j${k}\n  ON j${k}.${r.split('.').pop()}_key = t.${r.split('.').pop()}_key`).join('\n');
}

// ── Shared sidebar pieces ────────────────────────────────────────────────────
const statsHtml = (a,b,c,la,lb,lc) => `<div class="section"><div class="slabel">Summary</div><div class="stats">
  <div class="stat"><div class="n">${a}</div><div class="l">${la}</div></div>
  <div class="stat"><div class="n">${b}</div><div class="l">${lb}</div></div>
  <div class="stat"><div class="n">${c}</div><div class="l">${lc}</div></div></div></div>`;
const projSection = (pinN) => `<div class="section"><div class="slabel">Project Directory</div>
  <div class="proj-card"><b>${PROJECT}</b><small>${IDS.length} tables · ${EDGES.length} deps</small></div>
  <div class="btnrow"><button class="btn pri">▶ Open</button><button class="btn">Example</button><button class="btn" style="flex:0 0 32px">✕</button></div></div>`;
const tableList = (sel, openable) => `<div class="section"><div class="slabel">Tables ${openable ? '<span class="pin" style="vertical-align:middle;margin-left:4px">4</span>' : ''}</div><ul class="tlist">${
  ORDERED.map(id => `<li data-row="${id}" class="${id===sel?'sel':''}" style="--c:${color(id)}">${id}<span class="lv">L${LEVEL[id]}</span>${openable ? '<span class="open" data-open="'+id+'" title="Open in Query view">↗</span>' : ''}</li>`).join('')}</ul></div>`;

// ── Scenario: TODAY ──────────────────────────────────────────────────────────
function renderBefore(s) {
  if (s.view === 'project') {
    const body = s.loaded
      ? `<div class="canvas" id="dag">${dagSvg(null)}${hover ? tooltipBefore(hover) : ''}</div>`
      : `<div class="canvas"><div class="empty"><div class="ic">📁</div><p>Open a project folder to begin</p><small>Select a directory with .sql files named schema.table.sql</small><span class="pin">3</span></div></div>`;
    return `<header><span class="logo">⬡ table-deps</span><span class="sub">Project DAG</span><div class="spacer"></div>
        <span class="tip">Scroll to zoom · Pan canvas · Drag nodes · Hover to trace deps</span></header>
      <div class="main"><aside class="sb">
        <a class="navbtn" data-act="to-viz">SQL Visualizer<span class="arr">→</span><span class="pin">1</span></a>
        ${projSection()}${s.loaded ? statsHtml(IDS.length, EDGES.length, 4, 'Tables','Deps','Levels') + tableList(null,false) : ''}
      </aside>${body}</div>`;
  }
  const sql = s.file ? fakeSql(s.file) : '';
  return `<header><span class="logo">⬡ table-deps</span><span class="sub">SQL Table Dependency Visualizer</span><div class="spacer"></div>
      <span class="tip">Scroll to zoom · Drag nodes · Pan canvas</span></header>
    <div class="main"><aside class="sb">
      <a class="navbtn" data-act="to-proj">Project DAG<span class="arr">→</span><span class="pin">3</span></a>
      <div class="section"><div class="slabel">SQL Query <span class="pin" style="vertical-align:middle;margin-left:4px">4</span></div>
        <textarea class="sql">${esc(sql)}</textarea>
        <div class="btnrow"><button class="btn pri">▶ Analyze</button><button class="btn">Example</button><button class="btn" style="flex:0 0 32px">✕</button></div></div>
      ${s.file ? statsHtml(RAW[s.file].length + (EXT[s.file]||[]).length, 0, RAW[s.file].length, 'Tables','CTEs','Joins') : ''}
    </aside><div class="canvas">${s.file ? querySvg(s.file) : `<div class="empty"><div class="ic">⬡</div><p>Paste a SQL query and click Analyze</p></div>`}<span class="frozen">graph rendering unchanged</span></div></div>`;
}
function tooltipBefore(id) {
  const p = dagPos()[id], left = Math.min(75, (p.x+BW)/960*100), top = Math.min(70, p.y/560*100);
  return `<div class="tooltip" style="left:${left}%;top:${top}%"><div class="tn">${id}</div>
    <div class="r"><span>Reads from (project)</span><b>${RAW[id].length}</b></div>
    <div class="r"><span>Used by (project)</span><b>${usedBy(id).length}</b></div>
    <div class="r"><span>DAG level</span><b>${LEVEL[id]}</b></div>
    <div class="h">Double-click to open in visualizer <span class="pin" style="width:14px;height:14px;font-size:9px">2</span></div></div>`;
}

// ── Scenario A: unified shell ────────────────────────────────────────────────
function headerA(s) {
  const crumb = s.view === 'project'
    ? `<a data-act="proj-root" class="${s.sel?'':'cur'}">${PROJECT}</a>${s.sel ? `<span class="sep">›</span><span class="cur" style="opacity:.7">${s.sel} <small>(selected)</small></span>` : ''}`
    : s.file ? `<a data-act="to-proj">${PROJECT}</a><span class="sep">›</span><span class="cur">${s.file}.sql</span>` : `<span class="cur">Scratch query</span>`;
  return `<header><span class="logo">⬡ table-deps</span>
    <div class="seg"><button data-act="to-proj" class="${s.view==='project'?'on':''}">◇ Project <kbd>1</kbd></button><button data-act="to-query" class="${s.view==='query'?'on':''}">▭ Query <kbd>2</kbd></button></div>
    <span class="pin">1</span>
    <div class="crumb">${crumb}</div><span class="pin">2</span>
    <div class="spacer"></div>
    <button class="jump" data-act="palette">⌕ Jump to table…<span class="spacer"></span><kbd>⌘K</kbd></button><span class="pin">7</span>
  </header>`;
}
function inspector(id) {
  const ups = RAW[id], downs = usedBy(id), ext = EXT[id] || [];
  const chip = x => `<button class="chip" data-row="${x}"><span class="dot" style="background:${color(x)}"></span>${x}</button>`;
  return `<div class="inspector" style="--c:${color(id)}">
    <div class="ins-head" style="position:relative"><div class="nm">${id}</div><div class="fl">${id}.sql · level L${LEVEL[id]}</div><button class="close" data-act="desel">✕</button></div>
    <div class="ins-body">
      <div><div class="slabel">Reads from · ${ups.length}</div><div class="chips">${ups.map(chip).join('') || '<span class="sub" style="font-size:12px">— source table</span>'}</div></div>
      <div><div class="slabel">Used by · ${downs.length}</div><div class="chips">${downs.map(chip).join('') || '<span class="sub" style="font-size:12px">— leaf / report</span>'}</div></div>
      ${ext.length ? `<div><div class="slabel">External refs · ${ext.length}</div><div class="chips">${ext.map(e => `<span class="chip"><span class="dot" style="background:#6b7280"></span>${e}</span>`).join('')}</div></div>` : ''}
      <div class="kv"><span>Joins in query</span><b>${Math.max(0, ups.length + ext.length - 1)}</b></div>
    </div>
    <div class="ins-foot"><button class="btn pri" data-open="${id}">Open in Query view ↵</button><span class="pin abs" style="right:10px;bottom:56px">3</span>
      <div class="hint">or double-click the node · <kbd>Esc</kbd> to deselect</div></div>
  </div>`;
}
function renderA(s) {
  if (s.view === 'project') {
    return headerA(s) + `<div class="main"><aside class="sb">${projSection()}${statsHtml(IDS.length, EDGES.length, 4,'Tables','Deps','Levels')}${tableList(s.sel, true)}</aside>
      <div class="canvas" id="dag">${dagSvg(s.sel)}${s.sel ? inspector(s.sel) : ''}<span class="frozen">DAG rendering unchanged — simplified stand-in</span></div></div>`;
  }
  if (!s.file) {
    return headerA(s) + `<div class="ctx"><span class="lbl">Project <b style="color:var(--text)">${PROJECT}</b> is loaded — tables in your query that exist in it get a ↗ link.</span><span class="pin">6</span></div>
      <div class="main"><aside class="sb"><div class="section"><div class="slabel">SQL Query</div><textarea class="sql" placeholder="Paste your SQL here…"></textarea>
      <div class="btnrow"><button class="btn pri">▶ Analyze</button><button class="btn">Example</button></div></div></aside>
      <div class="canvas"><div class="empty"><div class="ic">⬡</div><p>Paste a SQL query and click Analyze</p><small>Or press <kbd>⌘K</kbd> to open any project file</small></div></div></div>`;
  }
  const f = s.file, k = ORDERED.indexOf(f);
  const chip = x => `<button class="chip" data-open="${x}"><span class="dot" style="background:${color(x)}"></span>${x}</button>`;
  return headerA(s) + `<div class="ctx">
      <button class="back" data-act="to-proj">← ${PROJECT} <kbd>Esc</kbd></button><span class="pin">4</span>
      <span class="divider"></span>
      <span class="lbl">Reads from</span>${RAW[f].map(chip).join('') || '<span class="lbl">—</span>'}
      <span class="divider"></span>
      <span class="lbl">Used by</span>${usedBy(f).map(chip).join('') || '<span class="lbl">—</span>'}
      <span class="pin">5</span>
      <div class="sib"><button data-open="${ORDERED[(k-1+ORDERED.length)%ORDERED.length]}" title="Previous file">‹</button><button data-open="${ORDERED[(k+1)%ORDERED.length]}" title="Next file">›</button></div>
    </div>
    <div class="main"><aside class="sb">
      <div class="section"><div class="src-note">From <b style="color:var(--text);font-family:var(--mono)">${f}.sql</b><button data-act="scratch">Edit as scratch</button></div>
        <textarea class="sql" readonly>${esc(fakeSql(f))}</textarea></div>
      ${statsHtml(RAW[f].length + (EXT[f]||[]).length, 0, Math.max(0, RAW[f].length + (EXT[f]||[]).length - 1), 'Tables','CTEs','Joins')}
    </aside>
    <div class="canvas" id="qg">${querySvg(f, { badges:true })}<span class="pin abs" style="right:16px;top:14px">6</span><span class="frozen">graph rendering unchanged — ↗ badge is the only addition</span></div></div>`;
}

// ── Scenario B: split view ───────────────────────────────────────────────────
function renderB(s) {
  return `<header><span class="logo">⬡ table-deps</span><div class="crumb"><span class="cur">${PROJECT}</span>${s.sel ? `<span class="sep">›</span><span class="cur">${s.sel}.sql</span>` : ''}</div>
      <div class="spacer"></div><button class="jump" data-act="palette">⌕ Jump to table…<span class="spacer"></span><kbd>⌘K</kbd></button></header>
    <div class="main"><aside class="sb" style="width:210px">${statsHtml(IDS.length, EDGES.length, 4,'Tables','Deps','Levels')}${tableList(s.sel, false)}</aside>
      <div class="canvas" id="dag">${dagSvg(s.sel)}<span class="pin abs" style="left:14px;top:12px">1</span><span class="frozen">DAG unchanged — but gets less width</span></div>
      ${s.sel ? `<div class="split"><div class="split-head"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${color(s.sel)}"></span>${s.sel}.sql<span class="pin">2</span><button class="x" data-act="desel">✕</button></div>
        <div class="canvas">${querySvg(s.sel, { badges:true })}<span class="pin abs" style="left:12px;top:12px">3</span></div></div>` : ''}
    </div>`;
}

// ── Notes panel ──────────────────────────────────────────────────────────────
const NOTES = {
  before: { h:'Today', v:'Two separate pages that barely know about each other.', items:[
    ['bad','Switching views is a link button buried at the top of the sidebar. It is labelled with the <i>other</i> page\'s name, so it reads like content, not navigation.'],
    ['bad','The only way to drill into a file is <b>double-click</b>, and you only find that out from the hover tooltip.'],
    ['bad','Drilling down opens a <b>new tab</b>. Back is disabled there, and "Project DAG →" from that tab lands on an <b>empty</b> Project view. The loaded project is lost.'],
    ['bad','The Query view has no idea which file it came from. It\'s just SQL in a textbox, with no way to jump to a neighbour.'],
  ], tryit:['Hover a node, then <b>double-click</b> it','Notice the new tab and the disabled ←','Click <b>Project DAG →</b> in the new tab'] },
  A: { h:'A · Unified shell', v:'One header and one tab. Each view knows its context. Recommended.', items:[
    ['','<b>Segmented switch</b> in the header, always visible. <kbd>1</kbd>/<kbd>2</kbd> switch views. Query remembers the last file you opened.'],
    ['','<b>Breadcrumb</b> shows where you are: <code>kimball_retail › fact.returns.sql</code>, or "Scratch query".'],
    ['','<b>Single-click selects</b> a node and opens an inspector with upstream/downstream chips and a primary <b>Open in Query view</b> button. Double-click and <kbd>↵</kbd> still work.'],
    ['','Opens in the <b>same tab</b> with a real URL. Browser back, <kbd>Esc</kbd> and "← kimball_retail" all return to the DAG with its selection and zoom intact.'],
    ['','<b>Context strip</b>: hop to an upstream or downstream file, or step ‹ › through files in DAG order, without going back to the DAG.'],
    ['','Tables in the query graph that are project files get a small <b>↗ badge</b>. Clicking one opens that file. This is the only change inside the graph.'],
    ['','<b>⌘K jump</b> to any table from either view.'],
  ], tryit:['<b>Click</b> a node (or a table row)','Hit <b>Open in Query view</b>','Click a chip or a ↗ node to hop files','Use the browser <b>←</b> or <kbd>Esc</kbd>','Press <kbd>⌘K</kbd>, <kbd>1</kbd>, <kbd>2</kbd>'],
    pc:[['Pros','Small change to code: header plus same-tab routing. Works with the static Vercel build. DAG keeps its full width.'],['Cons','You can\'t see the DAG and a query side by side.']] },
  B: { h:'B · Split view', v:'The DAG and the selected query graph side by side.', items:[
    ['','The DAG stays on the left, but loses about 45% of its width when a file is open.'],
    ['','Selecting a node opens its query graph in a right pane. No page change at all.'],
    ['','↗ nodes in the pane can re-target the selection.'],
  ], tryit:['Click any node','Click another, and watch the pane swap'],
    pc:[['Pros','Never lose sight of the DAG. Great on wide monitors.'],['Cons','Both graphs get cramped on laptops. Two D3 simulations on one page means a bigger refactor (shared ids and globals in visualizer.js and project.js).']] },
};
function renderNotes() {
  const n = NOTES[scenario];
  document.getElementById('notes').innerHTML = `<h2>${n.h}</h2><div class="verdict">${n.v}</div>
    <ol>${n.items.map(([c,t],k) => `<li><span class="pin">${k+1}</span><span class="${c}">${t}</span></li>`).join('')}</ol>
    <h3>Try it</h3><div class="try">${n.tryit.map(t => `<span>→ ${t}</span>`).join('')}</div>
    ${n.pc ? `<h3>Trade-off</h3><div class="proscons">${n.pc.map(([h,t]) => `<div><b>${h}</b>${t}</div>`).join('')}</div>` : ''}`;
}

// ── Palette (⌘K) ─────────────────────────────────────────────────────────────
function paletteHtml() {
  const q = palette.q.toLowerCase(), hits = ORDERED.filter(id => id.includes(q));
  palette.hits = hits; palette.i = Math.min(palette.i, Math.max(hits.length-1, 0));
  return `<div class="palette-bg" data-act="pal-close"><div class="palette">
    <input id="pal-in" placeholder="Jump to table or column…" value="${esc(palette.q)}" />
    <ul>${hits.map((id,k) => `<li class="${k===palette.i?'on':''}" data-open="${id}"><span class="chip"><span class="dot" style="background:${color(id)}"></span>${id.split('.')[0]}</span>${id}<span class="lv">L${LEVEL[id]}</span></li>`).join('')}</ul>
    <div class="foot"><span><kbd>↵</kbd> open query</span><span><kbd>⇧↵</kbd> show in DAG</span><span><kbd>Esc</kbd> close</span></div></div></div>`;
}

// ── Render + events ──────────────────────────────────────────────────────────
function render() {
  const s = cur();
  document.querySelectorAll('#scen button').forEach(b => b.classList.toggle('on', b.dataset.s === scenario));
  document.getElementById('tabs').innerHTML = tabs.map((t,k) => `<button class="tab ${k===active?'on':''}" data-tab="${k}">⬡ ${title(t.hist[t.i])}<span class="x">✕</span></button>`).join('');
  document.getElementById('addr').innerHTML = url(s);
  document.getElementById('nav-back').disabled = tabs[active].i === 0;
  document.getElementById('nav-fwd').disabled = tabs[active].i === tabs[active].hist.length-1;
  const app = document.getElementById('app');
  app.innerHTML = (scenario === 'before' ? renderBefore(s) : scenario === 'A' ? renderA(s) : renderB(s)) + (palette ? paletteHtml() : '');
  if (palette) { const i = document.getElementById('pal-in'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  renderNotes();
}

function openFile(id) {
  palette = null;
  if (scenario === 'B') return go({ sel:id });
  if (scenario === 'before') return openNewTab({ view:'query', file:id, loaded:false, sel:null });
  go({ view:'query', file:id, sel:id });
}
function select(id) {
  if (scenario === 'before') return;
  go({ sel: cur().sel === id ? null : id }, { replace: scenario === 'A' });
}

document.getElementById('scen').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  scenario = b.dataset.s; reset();
});
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (!t) return;
  const k = +t.dataset.tab;
  if (e.target.classList.contains('x') && tabs.length > 1) { tabs.splice(k,1); active = Math.min(active, tabs.length-1); }
  else active = k;
  render();
});
document.getElementById('nav-back').onclick = () => { tabs[active].i--; palette = null; render(); };
document.getElementById('nav-fwd').onclick  = () => { tabs[active].i++; palette = null; render(); };

const app = document.getElementById('app');
app.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open) { e.stopPropagation(); return openFile(open.dataset.open); }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'pal-close' && e.target.closest('.palette')) return;
  const s = cur();
  switch (act) {
    case 'to-viz':   return go({ view:'query', file:null });
    case 'to-proj':  return go({ view:'project', loaded: scenario !== 'before' || (s.view === 'project' && s.loaded), sel: scenario === 'A' ? (s.file || s.sel) : null });
    case 'to-query': return go({ view:'query' });
    case 'proj-root':
    case 'desel':    return go({ sel:null }, { replace:true });
    case 'scratch':  return go({ file:null });
    case 'palette':  palette = { q:'', i:0 }; return render();
    case 'pal-close':palette = null; return render();
  }
  const row = e.target.closest('[data-row]');
  if (row) return select(row.dataset.row);
  const node = e.target.closest('.gnode');
  if (node && node.closest('#dag')) return select(node.dataset.id);
  if (node && node.closest('#qg') && node.dataset.id in RAW) return openFile(node.dataset.id);
});
app.addEventListener('dblclick', e => {
  const node = e.target.closest('#dag .gnode'); if (node) openFile(node.dataset.id);
});
app.addEventListener('mouseover', e => {
  if (scenario !== 'before') return;
  const id = e.target.closest('#dag .gnode')?.dataset.id || null;
  if (id !== hover) { hover = id; render(); }
});
app.addEventListener('input', e => {
  if (e.target.id === 'pal-in') { palette.q = e.target.value; palette.i = 0; render(); }
});
document.addEventListener('keydown', e => {
  if (palette) {
    if (e.key === 'Escape') { palette = null; return render(); }
    if (e.key === 'ArrowDown') { palette.i = Math.min(palette.i+1, palette.hits.length-1); e.preventDefault(); return render(); }
    if (e.key === 'ArrowUp') { palette.i = Math.max(palette.i-1, 0); e.preventDefault(); return render(); }
    if (e.key === 'Enter' && palette.hits[palette.i]) {
      const id = palette.hits[palette.i]; palette = null;
      return e.shiftKey && scenario === 'A' ? go({ view:'project', sel:id }) : openFile(id);
    }
    return;
  }
  if (scenario === 'before' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  const s = cur();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palette = { q:'', i:0 }; return render(); }
  if (scenario !== 'A') return;
  if (e.key === '1') go({ view:'project', sel: s.file || s.sel });
  if (e.key === '2') go({ view:'query' });
  if (e.key === 'Enter' && s.view === 'project' && s.sel) openFile(s.sel);
  if (e.key === 'Escape') s.view === 'query' ? go({ view:'project', sel: s.file }) : go({ sel:null }, { replace:true });
});

reset();
</script>
</body>
